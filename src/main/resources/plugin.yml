name: ATConfirmGUI
version: 1.0.0
main: de.server.atconfirm.ATConfirmGUI
api-version: '1.21'
author: ServerOwner
description: Adds confirmation GUIs, a homes GUI and a warmup countdown for AdvancedTeleport.
load: STARTUP

softdepend:
  - AdvancedTeleport
  - CombatLogX

commands:
  tpa:
    description: Send a teleport request.
    usage: /tpa <player>
  tpahere:
    description: Ask a player to teleport to you.
    usage: /tpahere <player>
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept
  tpauto:
    description: Toggle auto-accept for TPA requests.
    usage: /tpauto
  tpsettings:
    description: Open teleport settings GUI.
    usage: /tpsettings
  rtp:
    description: Random teleport (opens a confirm GUI).
    usage: /rtp
  homes:
    description: Open your homes GUI.
    usage: /homes
