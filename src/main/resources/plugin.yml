name: ATConfirmGUI
version: 1.0.0
main: de.server.atconfirm.ATConfirmGUI
api-version: '1.21'
author: ServerOwner
description: Adds confirmation GUIs for AdvancedTeleport tpa/tpahere/accept.
load: STARTUP

softdepend:
  - AdvancedTeleport

commands:
  tpa:
    description: Send a teleport request (opens a confirm GUI).
    usage: /tpa <player>
  tpahere:
    description: Ask a player to teleport to you (opens a confirm GUI).
    usage: /tpahere <player>
  tpaccept:
    description: Accept a teleport request (opens a confirm GUI).
    usage: /tpaccept
  tpauto:
    description: Toggle auto-accept for TPA requests.
    usage: /tpauto
  tpsettings:
    description: Open teleport settings GUI.
    usage: /tpsettings
  settings:
    description: Open teleport settings GUI.
    usage: /tpsettings
