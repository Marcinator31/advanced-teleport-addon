name: ATConfirmGUI
version: 1.0.0
main: de.server.atconfirm.ATConfirmGUI
api-version: '1.21'
author: ServerOwner
description: Adds confirmation GUIs and warmup countdown for AdvancedTeleport.
load: STARTUP

softdepend:
  - AdvancedTeleport

commands:
  tpa:
    description: Send a teleport request.
    usage: /tpa <player>
  tpahere:
    description: Ask a player to teleport to you.
    usage: /tpahere <player>
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept
  tpauto:
    description: Toggle auto-accept.
    usage: /tpauto
  tpsettings:
    description: Open teleport settings.
    usage: /tpsettings
