name: Build Plugin

# Runs automatically on every push, and can be triggered by hand.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Upload the finished plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ATAddon
          path: target/ATAddon.jar
